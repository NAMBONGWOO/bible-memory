<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성경암송 Pro</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <!-- ① 인증 화면: 로그인 + 회원가입 -->
    <div id="auth-screen" class="auth-overlay">

        <!-- 로그인 카드 -->
        <div id="login-card" class="auth-card" style="display:flex; flex-direction:column; align-items:center;">
            <h2 style="color:var(--main-blue); margin-top:0;">성경암송 매니저</h2>
            <p style="font-size:14px; color:#666; margin-bottom:20px;">암송의 여정을 시작하세요.</p>
            <input type="email" id="login-email" class="test-input" placeholder="이메일 주소">
            <input type="password" id="login-pw" class="test-input" placeholder="비밀번호">
            <button class="btn primary-btn" onclick="handleLogin()">로그인</button>
            <p style="font-size:13px; margin-top:8px;">
                <a href="#" onclick="openResetModal()" style="color:#94a3b8; font-size:12px; text-decoration:none;">비밀번호를 잊으셨나요?</a>
            </p>
            <p style="font-size:13px; margin-top:4px;">
                계정이 없으신가요?
                <a href="#" onclick="openSignupModal()" style="color:var(--main-blue); font-weight:bold; text-decoration:none;">회원가입 하기</a>
            </p>
        </div>

        <!-- 비밀번호 재설정 카드 -->
        <div id="reset-card" class="auth-card" style="display:none; flex-direction:column; align-items:center;">
            <h3 style="color:var(--main-blue); margin:0 0 10px 0;">비밀번호 재설정</h3>
            <p style="font-size:13px; color:#666; margin-bottom:20px; text-align:center;">
                가입한 이메일을 입력하시면<br>재설정 링크를 보내드립니다.
            </p>
            <input type="email" id="reset-email" class="test-input" placeholder="이메일 주소">
            <span id="reset-msg" class="check-msg" style="text-align:center; min-height:18px;"></span>
            <button class="btn primary-btn" onclick="handleResetPassword()">재설정 메일 보내기</button>
            <button class="btn" style="background:#eee; color:#333; margin-top:0;" onclick="closeResetModal()">돌아가기</button>
        </div>

        <!-- 회원가입 카드 -->
        <div id="signup-card" class="auth-card" style="display:none;">
            <h3 style="color:var(--main-blue); margin: 0 0 20px 0; text-align:center;">새 계정 만들기</h3>

            <div style="text-align:left; width:100%;">
                <label style="font-size:12px; font-weight:bold;">이메일</label>
                <input type="email" id="reg-email" class="test-input" placeholder="이메일 입력">

                <label style="font-size:12px; font-weight:bold;">비밀번호</label>
                <input type="password" id="reg-pw" class="test-input" placeholder="비밀번호 (6자 이상)">
                <input type="password" id="reg-pw-confirm" class="test-input" placeholder="비밀번호 확인">
                <!-- [버그 수정] pw-match-msg 추가 -->
                <span id="pw-match-msg" class="check-msg"></span>

                <label style="font-size:12px; font-weight:bold;">닉네임</label>
                <input type="text" id="reg-nickname" class="test-input" placeholder="닉네임 (2자 이상)">
                <!-- [버그 수정] nick-match-msg 추가 -->
                <span id="nick-match-msg" class="check-msg"></span>

                <label style="font-weight:bold; font-size:13px; margin-top:10px; display:block;">암송 코스 선택</label>
                <!-- [개선] config.json에서 동적 로드하므로 빈 div로 유지 -->
                <div id="course-checkboxes" style="background:#f1f5f9; padding:10px; border-radius:10px; margin-top:5px; max-height:200px; overflow-y:auto;">
                    <p style="color:#888; font-size:13px; text-align:center; margin:0;">코스 목록 불러오는 중...</p>
                </div>
            </div>

            <div style="width:100%; margin-top:15px;">
                <button class="btn primary-btn" onclick="handleSignUpFinal()">가입 완료</button>
                <button class="btn" style="background:#eee; color:#333;" onclick="closeSignupModal()">취소</button>
            </div>
        </div>

    </div>

    <!-- ② 앱 본문: 로그인 성공 후 표시 -->
    <div id="app-content" style="display:none; width:100%;">

        <header class="top-bar">
            <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">≡</button>
            <div id="mode-title" style="font-weight:bold;">암송 카드 (연습)</div>
            <button onclick="handleLogout()" style="background:none; border:none; color:white; font-size:12px; cursor:pointer;">로그아웃</button>
        </header>

        <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
        <div class="side-menu" id="sideMenu">
            <div id="user-display" style="font-weight:bold; font-size:22px; color:var(--dark-blue); margin-bottom:25px;">사용자님</div>
            <div class="menu-item" style="padding:15px 0; border-bottom:1px solid #eee; cursor:pointer;" onclick="setMode('practice')">📖 암송 연습</div>
            <div class="menu-item" style="padding:15px 0; border-bottom:1px solid #eee; cursor:pointer;" onclick="setMode('test')">✍️ 암송 테스트</div>
            <div class="menu-item" style="padding:15px 0; border-bottom:1px solid #eee; cursor:pointer;" onclick="openRecordsScreen()">📊 암송 기록</div>

            <div style="margin-top:30px; font-size:11px; color:#999; font-weight:bold;">데이터 세트 선택</div>
            <!-- [개선] 내 코스 목록 -->
            <select id="data-select" class="test-input" onchange="loadData(this.value); toggleMenu();" style="margin-top:5px; height:40px; white-space:nowrap; text-overflow:ellipsis;"></select>
        </div>

        <main class="main-content" id="app-main-view">
            <div id="part-container" style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:20px; width:90%;"></div>

            <div id="status-panel" style="display:none; width:90%; max-width:450px; justify-content:space-between; margin-bottom:10px; color:white; font-size:14px; font-weight:bold;">
                <span id="test-progress">진행: 1 / 10</span>
                <span id="test-total-score">누적 감점: 0</span>
            </div>

            <div id="card-swipe-wrap" style="position:relative; width:90%; max-width:450px;">
                <!-- [요청#4] 반투명 좌우 화살표 (연습 모드에서만 표시) -->
                <div id="swipe-arrow-left" class="swipe-arrow" style="left:-6px;" onclick="prevVerse()">‹</div>
                <div id="swipe-arrow-right" class="swipe-arrow" style="right:-6px;" onclick="handleNext()">›</div>

            <div class="card" id="main-card" style="position:relative; width:100%; max-width:none;">
                <div id="v-ref" style="font-size:18px; font-weight:bold; color:var(--main-blue); margin-bottom:15px;">장절 정보</div>
                <!-- [요청#2] 분류코드를 카드 우측 하단으로 이동 -->
                <div id="v-id" style="position:absolute; right:16px; bottom:12px; font-size:11px; color:#c0c8d4;">ID</div>

                <!-- 테스트 시작 설정 -->
                <div id="test-setup" style="display:none;">
                    <p style="color:#333;">테스트할 구절 수를 입력하세요.</p>
                    <input type="number" id="test-count-input" class="test-input" value="10" style="text-align:center; width:80px; margin-bottom:15px;">
                    <button class="btn primary-btn" onclick="startTestSession()">테스트 시작</button>
                </div>

                <!-- 테스트 입력/채점 영역 -->
                <div id="test-section" style="display:none; width:100%;">
                    <input type="text" id="test-theme-input" class="test-input" placeholder="제목을 입력하세요">
                    <textarea id="test-content-input" class="test-input" style="height:120px; padding:15px;" placeholder="본문 내용을 입력하세요"></textarea>
                    <button id="check-btn" class="btn primary-btn" onclick="runCheck()">채점하기</button>
                    <div id="test-result-view" style="display:none; font-size:14px; line-height:1.6; margin-top:15px; text-align:left;"></div>
                </div>

                <!-- 연습 카드 영역 (클릭 시 본문 토글) -->
                <!-- [요청#4,5] 스와이프 지원 + 터치 영역 카드 전체로 확대 -->
                <div id="practice-area" style="cursor:pointer; width:100%; min-height:180px; touch-action:pan-y;">
                    <div id="v-theme" style="font-size:22px; font-weight:bold; margin-bottom:10px; color:#333;">주제</div>
                    <div id="v-content" style="font-size:19px; line-height:1.6; display:none; word-break:keep-all; color:#444;">내용</div>
                </div>
            </div>
            </div><!-- /card-swipe-wrap -->

            <div class="controls" style="width:90%; max-width:450px;">
                <div id="practice-controls" style="display:flex; gap:12px;">
                    <button class="btn" style="background:white; color:#333; flex:1; border:1px solid #ddd;" onclick="prevVerse()">이전</button>
                    <button class="btn primary-btn" style="flex:1;" onclick="handleNext()">다음</button>
                </div>
                <div id="test-controls" style="display:none;">
                    <button class="btn primary-btn" onclick="testNext()">다음 문제로</button>
                </div>
            </div>

            <div id="v-page" style="margin-top:20px; color:rgba(255,255,255,0.7); font-size:14px;">0 / 0</div>
        </main>

        <!-- ③ 암송 기록 화면 -->
        <div id="records-screen" style="display:none; width:100%;">
            <header class="top-bar" style="position:sticky; top:0;">
                <button onclick="closeRecordsScreen()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">‹</button>
                <div style="font-weight:bold;">암송 기록</div>
                <div style="width:22px;"></div>
            </header>

            <div class="records-tabs">
                <div class="records-tab active" data-tab="progress" onclick="switchRecordsTab('progress')">진도율</div>
                <div class="records-tab" data-tab="trend" onclick="switchRecordsTab('trend')">테스트 추이</div>
                <div class="records-tab" data-tab="wrong" onclick="switchRecordsTab('wrong')">오답 노트</div>
            </div>

            <div id="records-body" style="padding:16px; max-width:450px; margin:0 auto;"></div>
        </div>
    </div>

    <!-- [버그 수정] 로딩 순서: practice/test 먼저, 그 다음 module -->
    <script src="practice.js?v=6"></script>
    <script src="test.js?v=6"></script>
    <script type="module" src="auth.js?v=6"></script>
    <script type="module" src="records.js?v=6"></script>
    <script type="module" src="app.js?v=6"></script>

</body>
</html>
